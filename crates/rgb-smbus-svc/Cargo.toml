[package]
name = "rgb-smbus-svc"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rgb-core = { path = "../rgb-core" }
rgb-drivers = { path = "../rgb-drivers" }
libloading = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
